# Explicitly created by the load step, not included in base/ deployment.
apiVersion: batch/v1
kind: Job
metadata:
  name: meeps-day97-load
  namespace: meeps-dev
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 660
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meeps-day97-load
    spec:
      restartPolicy: Never
      serviceAccountName: meeps-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 10
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: load
          image: meeps-users-posts-api:week14-v2
          imagePullPolicy: Never
          command: ["python", "/load/load.py"]
          args: ["--rps", "200", "--seconds", "540", "--concurrency", "16"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 192Mi
          volumeMounts:
            - name: load-script
              mountPath: /load
              readOnly: true
      volumes:
        - name: load-script
          configMap:
            name: meeps-day97-load
