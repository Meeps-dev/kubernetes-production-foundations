apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: meeps-dev
spec:
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: Retain
    whenScaled: Retain
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: meeps-dev
      app.kubernetes.io/name: postgres
  serviceName: postgres-headless
  template:
    metadata:
      labels:
        app.kubernetes.io/component: database
        app.kubernetes.io/instance: meeps-dev
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: kubernetes-production-foundations
    spec:
      automountServiceAccountToken: false
      containers:
      - env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              key: POSTGRES_PASSWORD
              name: meeps-db-credentials
        - name: MIGRATION_PASSWORD
          valueFrom:
            secretKeyRef:
              key: MIGRATION_PASSWORD
              name: meeps-db-credentials
        envFrom:
        - configMapRef:
            name: meeps-db-config
        image: postgres@sha256:539ceaaae49b3a7c8a04467cf00cc6788d8e3f1675df41860d86eebc4c40524f
        imagePullPolicy: IfNotPresent
        name: postgres
        ports:
        - containerPort: 5432
          name: postgresql
        readinessProbe:
          exec:
            command:
            - sh
            - -ec
            - exec pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          failureThreshold: 3
          periodSeconds: 5
          timeoutSeconds: 3
        resources:
          limits:
            cpu: "1"
            memory: 512Mi
          requests:
            cpu: 100m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          exec:
            command:
            - sh
            - -ec
            - exec pg_isready -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"
          failureThreshold: 60
          periodSeconds: 5
          timeoutSeconds: 3
        volumeMounts:
        - mountPath: /var/lib/postgresql/data
          name: postgres-data
        - mountPath: /docker-entrypoint-initdb.d
          name: init-sql
          readOnly: true
        - mountPath: /var/run/postgresql
          name: postgres-run
        - mountPath: /tmp
          name: tmp
        - mountPath: /dev/shm
          name: shm
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        runAsGroup: 999
        runAsNonRoot: true
        runAsUser: 999
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: meeps-workloads
      terminationGracePeriodSeconds: 60
      volumes:
      - configMap:
          name: meeps-db-init
        name: init-sql
      - emptyDir: {}
        name: postgres-run
      - emptyDir: {}
        name: tmp
      - emptyDir:
          medium: Memory
          sizeLimit: 128Mi
        name: shm
  updateStrategy: {}
  volumeClaimTemplates:
  - metadata:
      name: postgres-data
    spec:
      accessModes:
      - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
      storageClassName: standard
    status: {}
status:
  availableReplicas: 0
  replicas: 0
