apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: meeps-dev
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: meeps-dev
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: meeps-dev
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: meeps-dev
  ports:
    - name: postgresql
      port: 5432
      targetPort: postgresql
      