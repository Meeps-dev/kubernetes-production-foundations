apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: meeps-api
  namespace: meeps-dev
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: meeps-api
  minReplicas: 2
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 60
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
        - type: Pods
          value: 1
          periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 180
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
