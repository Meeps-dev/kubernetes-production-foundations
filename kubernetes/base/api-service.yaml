apiVersion: v1
kind: Service
metadata:
  name: meeps-api
  namespace: meeps-dev
  labels:
    app.kubernetes.io/name: meeps-api
    app.kubernetes.io/instance: meeps-dev
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: kubernetes-production-foundations
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: meeps-api
    app.kubernetes.io/instance: meeps-dev
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
