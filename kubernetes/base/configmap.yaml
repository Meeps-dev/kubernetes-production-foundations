apiVersion: v1
kind: ConfigMap
metadata:
  name: meeps-db-config
  namespace: meeps-dev
  labels:
    app.kubernetes.io/part-of: kubernetes-production-foundations
data:
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "meeps_users_posts"
  POSTGRES_HOST: "postgres"
  POSTGRES_PORT: "5432"
  MIGRATION_USER: "meeps_migrator"
  PGDATA: "/var/lib/postgresql/data/pgdata"
  POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: meeps-db-init
  namespace: meeps-dev
data:
  10-create-migrator.sql: |
    \getenv migration_user MIGRATION_USER
    \getenv migration_password MIGRATION_PASSWORD
    \getenv database_name POSTGRES_DB

    CREATE ROLE :"migration_user" WITH LOGIN
      NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS
      PASSWORD :'migration_password';

    ALTER DATABASE :"database_name" OWNER TO :"migration_user";
    ALTER SCHEMA public OWNER TO :"migration_user";
    REVOKE CREATE ON SCHEMA public FROM PUBLIC;