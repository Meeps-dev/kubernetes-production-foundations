apiVersion: apps/v1
kind: Deployment
metadata:
  name: meeps-api
  namespace: meeps-dev
  labels:
    app.kubernetes.io/name: meeps-api
    app.kubernetes.io/instance: meeps-dev
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: kubernetes-production-foundations
    app.kubernetes.io/managed-by: kubectl
spec:
  replicas: 2
  revisionHistoryLimit: 3
  minReadySeconds: 5
  progressDeadlineSeconds: 180
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: meeps-api
      app.kubernetes.io/instance: meeps-dev
  template:
    metadata:
      labels:
        app.kubernetes.io/name: meeps-api
        app.kubernetes.io/instance: meeps-dev
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: kubernetes-production-foundations
        app.kubernetes.io/version: k8s-v1
    spec:
      serviceAccountName: meeps-api
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: meeps-users-posts-api:k8s-v1
          imagePullPolicy: Never
          command: ["python", "-m", "uvicorn"]
          args:
            - app.main:app
            - --host
            - 0.0.0.0
            - --port
            - "8000"
            - --timeout-graceful-shutdown
            - "20"
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: meeps-api-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: meeps-api-credentials
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
          # HTTP responsiveness only. Database-aware readiness and other
          # probe exercises are reserved for Day 95.
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
