apiVersion: v1
kind: Namespace
metadata:
  name: meeps-dev

  labels:
    app.kubernetes.io/name: meeps-platform
    app.kubernetes.io/instance: meeps-dev
    app.kubernetes.io/part-of: kubernetes-production-foundations
    app.kubernetes.io/managed-by: kubectl

    project: meeps
    environment: dev
    owner: meeps
    week: week-14

    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/audit-version: v1.37
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/warn-version: v1.37

  annotations:
    description: "Local Kubernetes foundations lab for the Meeps API."
