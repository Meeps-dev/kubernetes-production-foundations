apiVersion: v1
kind: ServiceAccount
metadata:
  name: meeps-traefik
  namespace: traefik-system
# Unlike the API, this controller must authenticate to the Kubernetes API.
automountServiceAccountToken: true
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: meeps-traefik-reader
  namespace: meeps-dev
rules:
  - apiGroups: [""]
    resources: [services, secrets]
    verbs: [get, list, watch]
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingresses/status]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: meeps-traefik-reader
  namespace: meeps-dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: meeps-traefik-reader
subjects:
  - kind: ServiceAccount
    name: meeps-traefik
    namespace: traefik-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: meeps-traefik-discovery
rules:
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [nodes]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: meeps-traefik-discovery
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: meeps-traefik-discovery
subjects:
  - kind: ServiceAccount
    name: meeps-traefik
    namespace: traefik-system
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: meeps-traefik
spec:
  controller: traefik.io/ingress-controller
