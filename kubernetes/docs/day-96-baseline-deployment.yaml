apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/instance: meeps-dev
    app.kubernetes.io/managed-by: kubectl
    app.kubernetes.io/name: meeps-api
    app.kubernetes.io/part-of: kubernetes-production-foundations
  name: meeps-api
  namespace: meeps-dev
spec:
  minReadySeconds: 5
  progressDeadlineSeconds: 180
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/instance: meeps-dev
      app.kubernetes.io/name: meeps-api
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: api
        app.kubernetes.io/instance: meeps-dev
        app.kubernetes.io/name: meeps-api
        app.kubernetes.io/part-of: kubernetes-production-foundations
        app.kubernetes.io/version: k8s-v2
    spec:
      automountServiceAccountToken: false
      containers:
      - args:
        - app.main:app
        - --host
        - 0.0.0.0
        - --port
        - "8000"
        - --timeout-graceful-shutdown
        - "20"
        command:
        - python
        - -m
        - uvicorn
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              key: DATABASE_URL
              name: meeps-api-credentials
        envFrom:
        - configMapRef:
            name: meeps-api-config
        image: meeps-users-posts-api:k8s-v2
        imagePullPolicy: Never
        livenessProbe:
          failureThreshold: 3
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
          timeoutSeconds: 2
        name: api
        ports:
        - containerPort: 8000
          name: http
        readinessProbe:
          failureThreshold: 2
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          successThreshold: 1
          timeoutSeconds: 5
        resources:
          limits:
            cpu: 500m
            memory: 256Mi
          requests:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 24
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 2
        volumeMounts:
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 10001
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: meeps-api
      terminationGracePeriodSeconds: 30
      volumes:
      - emptyDir:
          sizeLimit: 64Mi
        name: tmp
